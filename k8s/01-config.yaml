# Non-secret settings (the passwords live in a Secret, see the guide, Step 7).
apiVersion: v1
kind: ConfigMap
metadata:
  name: saksham-config
  namespace: saksham
data:
  NODE_ENV: "production"
  PORT: "5000"
  DB_NAME: "health_finance_db"
  DB_USER: "postgres"
  DB_HOST: "postgres"       # the name of the postgres Service below
  DB_PORT: "5432"
  JWT_EXPIRES_IN: "30d"
  # Address you open in the browser. Change YOUR_VM_IP to the VM's IP address.
  CLIENT_URL: "http://192.168.31.128:30080"
  PUBLIC_BASE_URL: "http://192.168.31.128:30080"
---
# nginx settings for Kubernetes: plain HTTP (the EC2 version in frontend/nginx.conf
# uses a Let's Encrypt certificate, which does not exist inside the cluster).
# It is mounted over the image's default config, so the SAME image runs on both.
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-nginx
  namespace: saksham
data:
  default.conf: |
    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        location /assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
        location = /sw.js {
            try_files $uri =404;
            add_header Cache-Control "no-cache";
        }
        location = /manifest.webmanifest {
            try_files $uri =404;
            add_header Cache-Control "no-cache";
        }

        location /api/ {
            proxy_pass http://backend:5000/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
