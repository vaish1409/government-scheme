apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: saksham
spec:
  # Start with 1: on first start each pod creates the tables, and two pods
  # doing that at once can collide. Scale up afterwards:
  #   kubectl -n saksham scale deployment backend --replicas=3
  replicas: 1
  selector:
    matchLabels:
      app: backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: backend
    spec:
      initContainers:
        # Wait until the database accepts connections before starting the API.
        - name: wait-for-db
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z postgres 5432; do echo waiting for postgres; sleep 2; done"]
      containers:
        - name: backend
          image: __BACKEND_IMAGE__
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: saksham-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: saksham-secret, key: DB_PASSWORD }
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: { name: saksham-secret, key: JWT_SECRET }
            - name: OFFICER_KEY
              valueFrom:
                secretKeyRef: { name: saksham-secret, key: OFFICER_KEY }
          readinessProbe:
            httpGet: { path: /health, port: 5000 }
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 5000 }
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 384Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: backend          # nginx proxies to http://backend:5000, so keep this name
  namespace: saksham
spec:
  selector:
    app: backend
  ports:
    - port: 5000
      targetPort: 5000
