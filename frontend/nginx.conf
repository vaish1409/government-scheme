# frontend/nginx.conf
# Served inside the frontend container. Two jobs:
#   1. Serve the built React app as static files, with SPA fallback so a
#      refresh on e.g. /assistant doesn't 404.
#   2. Reverse-proxy /api/* to the backend container, so frontend and API
#      share one origin (the Elastic IP or domain you visit) — no CORS, no
#      hardcoded backend address baked into the frontend build.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Static assets: fingerprinted filenames (Vite adds a content hash), so
    # it's safe to cache these aggressively.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # PWA service worker / manifest must NOT be cached long, or installed
    # devices stop picking up new deploys.
    location = /sw.js {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    # Everything under /api/ goes to the backend container. The service name
    # "backend" below is the name of the service in docker-compose.yml, which
    # Docker's internal DNS resolves automatically — it is NOT a public URL.
    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React Router: any other path that isn't a real file falls back to
    # index.html so client-side routing can take over.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
