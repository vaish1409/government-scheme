server {
    listen 80;
    server_name _;
    return 301 https://saksham-vaish.duckdns.org$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name saksham-vaish.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/saksham-vaish.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/saksham-vaish.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location = /sw.js {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
